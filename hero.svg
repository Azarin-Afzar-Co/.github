<svg viewBox="0 0 900 1000" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@700;800&family=Poppins:wght@500;600;700&display=swap');
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:#050e24;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    font-family:'Poppins',sans-serif;
  }
  .stage{
    position:relative;
    width:min(100vw,100vh);
    height:min(100vw,100vh);
    max-width:860px; max-height:860px;
  }
  svg{ width:100%; height:100%; display:block; }

  .leg{
    stroke-dasharray:900;
    stroke-dashoffset:900;
    animation:draw 1s cubic-bezier(.25,.7,.2,1) forwards;
  }
  .leg-blue{ animation-delay:.15s; }
  .leg-gold{ animation-delay:.35s; }
  .f-part{
    stroke-dasharray:400;
    stroke-dashoffset:400;
    animation:draw .55s ease-out forwards;
  }
  .f-stem{ animation-delay:.65s; }
  .f-top{ animation-delay:.9s; }
  .f-mid{ animation-delay:1.05s; }
  .pad{
    opacity:0;
    animation:fadeIn .35s ease-out forwards;
  }
  .trace{
    stroke-dasharray:520;
    stroke-dashoffset:520;
    animation:draw .9s ease-out .5s forwards;
  }
  .persian{ opacity:0; animation:fadeUp .7s ease-out 1.35s forwards; }
  .english{ opacity:0; animation:fadeUp .7s ease-out 1.52s forwards; }
  .tagline{ opacity:0; animation:fadeUp .7s ease-out 1.7s forwards; }

  @keyframes draw{ to{ stroke-dashoffset:0; } }
  @keyframes fadeIn{ to{ opacity:1; } }
  @keyframes fadeUp{ 0%{opacity:0; transform:translateY(14px);} 100%{opacity:1; transform:translateY(0);} }
</style>
  <defs>
    <radialGradient id="bg" cx="68%" cy="10%" r="95%">
      <stop offset="0%" stop-color="#123a7c"/>
      <stop offset="45%" stop-color="#0a1c45"/>
      <stop offset="100%" stop-color="#050e24"/>
    </radialGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4d98e"/>
      <stop offset="45%" stop-color="#d6a63f"/>
      <stop offset="100%" stop-color="#9c6c1e"/>
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8fd8ff"/>
      <stop offset="50%" stop-color="#3f93ea"/>
      <stop offset="100%" stop-color="#0d4ea3"/>
    </linearGradient>

    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="1000" fill="url(#bg)"/>

  <g>
    <!-- blue leg (left stroke of A) -->
    <path class="leg leg-blue" d="M450,168 L300,626" fill="none" stroke="url(#blueGrad)"
          stroke-width="46" stroke-linecap="round"/>

    <!-- circuit / PCB trace running along the blue leg = technology motif -->
    <path id="circuitPath" class="trace" d="M430,230 L430,300 L407,300 L407,380 L381,380 L381,460 L354,460 L354,540 L328,540 L328,600"
          fill="none" stroke="#bfeaff" stroke-width="3.5" opacity="0.85"/>
    <g fill="#eaf6ff">
      <rect class="pad" x="425" y="295" width="10" height="10" rx="2" style="animation-delay:1.0s"/>
      <rect class="pad" x="402" y="375" width="10" height="10" rx="2" style="animation-delay:1.1s"/>
      <rect class="pad" x="376" y="455" width="10" height="10" rx="2" style="animation-delay:1.2s"/>
      <rect class="pad" x="349" y="535" width="10" height="10" rx="2" style="animation-delay:1.3s"/>
    </g>
    <!-- traveling data pulse: the "intelligence / live signal" animation -->
    <circle r="7" fill="#eafcff" filter="url(#softGlow)">
      <animateMotion dur="3s" repeatCount="indefinite" begin="1.6s">
        <mpath href="#circuitPath"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.9;1" dur="3s" repeatCount="indefinite" begin="1.6s"/>
    </circle>

    <!-- gold leg (right stroke of A) -->
    <path class="leg leg-gold" d="M450,168 L600,626" fill="none" stroke="url(#goldGrad)"
          stroke-width="46" stroke-linecap="round"/>

    <!-- F nested inside the open triangle of the A -->
    <path class="f-part f-stem" d="M428,340 L428,610" fill="none" stroke="#eaf6ff" stroke-width="24" stroke-linecap="round"/>
    <path class="f-part f-top" d="M428,340 L500,340" fill="none" stroke="#eaf6ff" stroke-width="24" stroke-linecap="round"/>
    <path class="f-part f-mid" d="M428,460 L478,460" fill="none" stroke="#eaf6ff" stroke-width="24" stroke-linecap="round"/>
  </g>

  <text class="persian" x="450" y="740" text-anchor="middle"
        font-family="'Vazirmatn', sans-serif" font-weight="800" font-size="86" fill="#f4f8ff"
        style="letter-spacing:1px;">آذرین افزار</text>

  <text class="english" x="450" y="825" text-anchor="middle"
        font-family="'Poppins', sans-serif" font-weight="600" font-size="46" fill="#f4f8ff"
        style="letter-spacing:12px;">AZARIN AFZAR</text>

  <text class="tagline" x="450" y="878" text-anchor="middle"
        font-family="'Poppins', sans-serif" font-weight="500" font-size="22"
        style="letter-spacing:4px;">
    <tspan fill="#5aa8e8">CODE</tspan>
    <tspan fill="#dcae5c"> • </tspan>
    <tspan fill="#bfe0ff">INTELLIGENCE</tspan>
    <tspan fill="#dcae5c"> • </tspan>
    <tspan fill="#dcae5c">FUTURE</tspan>
  </text>
</svg>