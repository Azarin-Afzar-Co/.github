<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
    <stop stop-color="#020817"/>
    <stop offset="0.5" stop-color="#062B66"/>
    <stop offset="1" stop-color="#04112C"/>
  </linearGradient>
  <linearGradient id="line" x1="150" y1="350" x2="1050" y2="70" gradientUnits="userSpaceOnUse">
    <stop stop-color="#00C6FF"/>
    <stop offset="0.5" stop-color="#55E7FF"/>
    <stop offset="1" stop-color="#FFD76A"/>
  </linearGradient>
  <linearGradient id="gold" x1="560" y1="110" x2="680" y2="300" gradientUnits="userSpaceOnUse">
    <stop stop-color="#FFF0A8"/>
    <stop offset="0.45" stop-color="#D9A83F"/>
    <stop offset="1" stop-color="#FFE08A"/>
  </linearGradient>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="35"/>
  </filter>
  <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
    <path d="M42 0H0V42" stroke="#7DD3FC" stroke-opacity=".07"/>
  </pattern>
</defs>

<rect width="1200" height="420" rx="28" fill="url(#bg)"/>
<rect width="1200" height="420" rx="28" fill="url(#grid)"/>

<circle cx="1000" cy="60" r="150" fill="#008CFF" fill-opacity=".14" filter="url(#soft)">
  <animate attributeName="r" values="120;175;120" dur="5s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".10;.20;.10" dur="5s" repeatCount="indefinite"/>
</circle>

<!-- orbit -->
<ellipse cx="600" cy="205" rx="470" ry="130" stroke="#38D9FF" stroke-opacity=".16"/>
<ellipse cx="600" cy="205" rx="330" ry="88" stroke="#FFD86B" stroke-opacity=".10"/>

<circle cx="140" cy="90" r="2.5" fill="#8BE9FF">
  <animate attributeName="cy" values="90;330;90" dur="7s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values=".2;1;.2" dur="7s" repeatCount="indefinite"/>
</circle>
<circle cx="1030" cy="300" r="2.5" fill="#FFD86B">
  <animate attributeName="cx" values="1030;850;1030" dur="6s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="1;.2;1" dur="6s" repeatCount="indefinite"/>
</circle>

<!-- abstract A / intelligence mark -->
<path d="M505 280L570 125C581 99 619 99 630 125L695 280" stroke="url(#line)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
<path d="M535 225H665" stroke="url(#gold)" stroke-width="12" stroke-linecap="round"/>
<path d="M615 126C720 180 805 170 900 105" stroke="#35DFFF" stroke-width="7" stroke-linecap="round">
  <animate attributeName="stroke-dasharray" values="0 500;500 0;0 500" dur="5s" repeatCount="indefinite"/>
</path>

<!-- headline -->
<text x="600" y="315" text-anchor="middle" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" letter-spacing="8">AZARIN AFZAR</text>
<text x="600" y="352" text-anchor="middle" fill="#A9DFFF" font-family="Arial, Helvetica, sans-serif" font-size="16" letter-spacing="6">CODE • INTELLIGENCE • FUTURE</text>

<path d="M360 378H840" stroke="url(#line)" stroke-opacity=".35" stroke-linecap="round">
  <animate attributeName="stroke-opacity" values=".15;.7;.15" dur="3s" repeatCount="indefinite"/>
</path>
</svg>